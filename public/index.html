<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one column "figure card" like a product sheet: controls on top, inked turntable wheel, list of kedai below */
:root{
  --paper:#ece8e0; --card:#f5f2ec; --ink:#1f1c18; --muted:#6b655c;
  --shadow:#3f5291; --body:#93d2b0;
  --s1:#f2bb33; --s2:#ef6a4a; --s3:#93d2b0; --s4:#6f9be6; --s5:#f2a3bf; --s6:#faf6ea;
  --blank:#dcd6cb;
  --f-display:"Courier Prime","Courier New",monospace;
  --f-ui:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,40px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:26px;box-shadow:7px 7px 0 var(--ink);padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-right:7px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pill{font-family:var(--f-display);font-size:16px;background:transparent;color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer;transition:transform .1s,background .15s}
.pill:hover{background:var(--paper)}
.pill:active{transform:translateY(2px)}
.pill:focus-visible,input:focus-visible,textarea:focus-visible,.dot.btn:focus-visible,.x:focus-visible{outline:3px solid var(--s4);outline-offset:2px}
.pill.go{background:var(--ink);color:var(--card)}
.pill:disabled{opacity:.45;cursor:default}
canvas{width:100%;max-width:100%;display:block;touch-action:manipulation;cursor:pointer}
.status{font-family:var(--f-display);font-size:14px;color:var(--muted);text-align:center;min-height:1.4em}
.result{border:2.5px dashed var(--ink);border-radius:18px;padding:12px 14px;text-align:center;font-family:var(--f-display)}
.result small{display:block;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:11px}
.result b{display:block;font-size:24px;margin-top:2px;word-break:break-word}
.lbl{letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:12px;margin:0}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.legend li{border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;gap:7px;font-size:13px;max-width:100%}
.legend li.taken{opacity:.45;text-decoration:line-through}
.legend .dot{width:16px;height:16px}
.empty{font-size:13px;color:var(--muted);margin:0}
.head{display:grid;gap:10px}
.field{position:relative}
#title{width:100%;font-family:var(--f-display);font-weight:700;font-size:clamp(20px,6vw,32px);border-radius:18px;padding:10px 16px;background:var(--card)}
#desc{width:100%;min-height:72px;resize:vertical;font:inherit;font-size:14px;line-height:1.5;color:var(--ink);background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:10px 16px 10px}
#title::placeholder,#desc::placeholder,input::placeholder{color:#9a948a;opacity:1}
.opt{position:absolute;right:14px;top:-9px;background:var(--paper);padding:0 6px;font-size:11px;letter-spacing:.1em;color:var(--muted)}
li .dot.btn{cursor:pointer;padding:0}
form{display:flex;gap:8px}
input{width:auto;flex:1;min-width:0;font:inherit;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:9px 16px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{display:flex;align-items:center;gap:10px;border-bottom:1.5px dotted var(--muted);padding:6px 2px}
li .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
li span.n{flex:1;min-width:0;word-break:break-word}
li.taken span.n{text-decoration:line-through;color:var(--muted)}
li .tag{font-size:11px;color:var(--muted);letter-spacing:.08em}
.x{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:50%;width:28px;height:28px;cursor:pointer;font:600 14px var(--f-ui);flex:none}
.foot{font-size:12px;color:var(--muted);margin:0}
.share{display:grid;gap:10px;border-top:2px solid var(--ink);padding-top:14px}
.share .pill{justify-self:start}
.linkrow{display:flex;gap:8px}
.linkrow input{font-size:13px}
@media (prefers-reduced-motion:reduce){.pill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="field"><input id="title" maxlength="80" placeholder="Name your spin board" autocomplete="off" aria-label="Board title"></div>
    <div class="field"><textarea id="desc" maxlength="300" placeholder="Description" aria-label="Description (optional)"></textarea><span class="opt">*OPTIONAL</span></div>
  </header>

  <section class="card" aria-label="Wheel">
    <div class="row">
      <button class="pill go" id="spin">Spin</button>
      <button class="pill" id="reset">Reset board</button>
    </div>
    <canvas id="wheel" aria-label="Spin board, tap to spin"></canvas>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="result" id="result" hidden><small>So what we have here is...</small><b id="resName"></b></div>
    <p class="lbl">Legend</p>
    <ul class="legend" id="legend"></ul>
  </section>

  <section class="card" aria-label="Board legend">
    <p class="lbl">Board legend</p>
    <form id="addForm">
      <input id="newName" maxlength="40" placeholder="Add a board choice" autocomplete="off">
      <button class="pill" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div class="share">
      <button class="pill go" id="invite" type="button">Create share link</button>
      <p class="foot" id="roomInfo"></p>
      <div class="linkrow" id="linkBox" hidden><input id="linkTxt" readonly aria-label="Share link"><button class="pill" id="copy" type="button">Copy</button></div>
    </div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s);
const cv=$("#wheel"),ctx=cv.getContext("2d");
let items=[], rot=0, spinning=false, seenSpin=null, ver=0, pending=false, loaded=false, title="", desc="";
const qs=new URLSearchParams(location.search);
let ROOM=(qs.get("board")||qs.get("bilik")||"").replace(/[^a-z0-9]/gi,"").slice(0,16)||null;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* random colour, kept away from colours already on the board */
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return"#"+[0,8,4].map(n=>Math.round(f(n)*255).toString(16).padStart(2,"0")).join("")}
function hueOf(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return(h*60+360)%360}
function randColor(){
  const used=items.map(i=>hueOf(i.c));let best=0,bestGap=-1;
  for(let k=0;k<24;k++){const h=Math.random()*360;const gap=used.length?Math.min(...used.map(u=>Math.min(Math.abs(u-h),360-Math.abs(u-h)))):360;if(gap>bestGap){bestGap=gap;best=h}if(gap>40)break}
  return hsl2hex(best,60+Math.random()*25,64+Math.random()*12);
}
const okHex=c=>/^#[0-9a-f]{6}$/i.test(c||"");

const pack=()=>({title,desc,items:items.map(i=>({n:i.n,t:i.t,c:i.c})),spin:seenSpin});
function unpack(d){
  d=d||{};title=String(d.title||"").slice(0,80);desc=String(d.desc||"").slice(0,300);items=[];
  ((d.items)||[]).slice(0,60).forEach(x=>items.push({n:String(x.n).slice(0,40),t:!!x.t,w:x.t?0:1,c:okHex(x.c)?x.c:randColor()}));
  fillHead();
}
function fillHead(){
  if(document.activeElement!==$("#title"))$("#title").value=title;
  if(document.activeElement!==$("#desc"))$("#desc").value=desc;
  document.title=title||"Spin board";
}
let pushT,netOk=true;
function net(ok){if(ok!==netOk){netOk=ok;roomInfo()}}
function save(){if(!ROOM)return;pending=true;clearTimeout(pushT);pushT=setTimeout(()=>push(),350)}
async function push(payload){
  pending=true;
  try{const r=await fetch("/api/bilik/"+ROOM,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(payload||pack())});
    const j=await r.json();if(j.v)ver=j.v;net(r.ok)}catch(e){net(false)}
  pending=false;
}
async function pull(){
  if(!ROOM||spinning||pending)return;
  try{
    const r=await fetch("/api/bilik/"+ROOM,{cache:"no-store"});const j=await r.json();net(r.ok);
    if(!j||!j.v||j.v<=ver||spinning||pending){loaded=true;return}
    ver=j.v;const d=j.data||{items:[]};
    if(loaded&&d.spin&&(!seenSpin||d.spin.id!==seenSpin.id)&&d.items[d.spin.pick]){
      seenSpin=d.spin;
      unpack({...d,items:d.items.map((x,i)=>({...x,t:i===d.spin.pick?false:x.t}))});refresh();
      spin(d.spin.pick,true);
    }else{seenSpin=d.spin||null;unpack(d);refresh()}
    loaded=true;
  }catch(e){net(false)}
}

let W=500,H=520;
items.forEach(it=>it.w=it.t?0:1);
function size(){const d=devicePixelRatio||1;W=cv.clientWidth||500;H=W*.82;cv.width=W*d;cv.height=H*d;cv.style.height=H+"px";ctx.setTransform(d,0,0,d,0,0);draw()}
function layout(){const tot=items.reduce((s,i)=>s+i.w,0);let acc=0;return items.map(it=>{const a0=acc;acc+=tot?it.w/tot*Math.PI*2:0;return[a0,acc]})}
function shade(c,f){const m=c.match(/^#(..)(..)(..)$/);if(!m)return c;return"#"+[1,2,3].map(i=>Math.round(parseInt(m[i],16)*f).toString(16).padStart(2,"0")).join("")}

function draw(){
  const ink=css("--ink"),K=.56,cx=W/2,cy=H*.4,R=W*.42,D=W*.075,lw=Math.max(2.2,W/190);
  const P=(x,y)=>[cx+x,cy+y*K];
  ctx.clearRect(0,0,W,H);ctx.lineJoin="round";ctx.lineCap="round";
  ctx.fillStyle=css("--shadow");ctx.beginPath();ctx.ellipse(cx+W*.03,cy+D+R*K*.25,R*1.02,R*K*1.05,0,0,7);ctx.fill();
  ctx.fillStyle=ink;[-.6,.6].forEach(f=>{ctx.beginPath();ctx.roundRect(cx+f*R-6,cy+D+R*K*.78,12,R*.12,4);ctx.fill()});
  const body=css("--body");
  ctx.beginPath();ctx.ellipse(cx,cy+D,R,R*K,0,0,Math.PI);ctx.lineTo(cx-R,cy);ctx.ellipse(cx,cy,R,R*K,0,Math.PI,0,true);ctx.closePath();
  ctx.fillStyle=body;ctx.fill();ctx.fillStyle="rgba(0,0,0,.28)";ctx.fill();
  ctx.lineWidth=lw;ctx.strokeStyle=ink;ctx.stroke();
  ctx.lineWidth=lw*.5;for(let i=1;i<12;i++){const a=Math.PI*i/12,x=Math.cos(a)*R,y=Math.sin(a)*R*K;ctx.beginPath();ctx.moveTo(cx+x,cy+y+D*.3);ctx.lineTo(cx+x,cy+y+D*.7);ctx.stroke()}
  const L=layout(),vis=items.filter(i=>i.w>.001).length;
  ctx.save();ctx.translate(cx,cy);ctx.scale(1,K);
  ctx.fillStyle=css("--blank");ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  if(vis)items.forEach((it,i)=>{const[a0,a1]=L[i];if(a1-a0<1e-4)return;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,rot+a0,rot+a1);ctx.closePath();ctx.fillStyle=it.c;ctx.fill()});
  ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillStyle="#1f1c18";
  items.forEach((it,i)=>{const[a0,a1]=L[i],span=a1-a0;if(span<.12)return;
    const fs=Math.max(10,Math.min(17,W/24,span*R*.45));ctx.font=`700 ${fs}px ${css("--f-display")}`;
    ctx.save();ctx.rotate(rot+(a0+a1)/2);ctx.globalAlpha=Math.min(1,it.w*1.4);
    let t=it.n;const max=R*.68;while(ctx.measureText(t).width>max&&t.length>3)t=t.slice(0,-2)+"…";
    ctx.fillText(t,R*.9,0);ctx.restore()});
  ctx.globalAlpha=1;ctx.restore();
  ctx.strokeStyle=ink;ctx.lineWidth=lw*.7;
  if(vis>1)items.forEach((it,i)=>{const[a0,a1]=L[i];if(a1-a0<1e-4)return;const a=rot+a0;ctx.beginPath();ctx.moveTo(...P(0,0));ctx.lineTo(...P(Math.cos(a)*R,Math.sin(a)*R));ctx.stroke()});
  ctx.lineWidth=lw;ctx.beginPath();ctx.ellipse(cx,cy,R,R*K,0,0,7);ctx.stroke();
  ctx.lineWidth=lw*.45;ctx.globalAlpha=.5;ctx.beginPath();ctx.ellipse(cx+1.2,cy+.8,R*.97,R*K*.97,0,0,7);ctx.stroke();ctx.globalAlpha=1;
  ctx.beginPath();ctx.ellipse(cx,cy+4,R*.17,R*.17*K,0,0,7);ctx.fillStyle=ink;ctx.fill();
  ctx.fillStyle=css("--s6");ctx.beginPath();ctx.ellipse(cx,cy,R*.17,R*.17*K,0,0,7);ctx.fill();ctx.lineWidth=lw;ctx.stroke();
  ctx.fillStyle="#1f1c18";ctx.font=`700 ${Math.max(9,W/42)}px ${css("--f-ui")}`;ctx.textAlign="center";ctx.fillText(spinning?"...":"SPIN",cx,cy+1);
  const fy=cy+R*K;
  ctx.fillStyle=ink;ctx.beginPath();ctx.roundRect(cx-5,fy-2,10,D+10,3);ctx.fill();
  ctx.beginPath();ctx.moveTo(cx,fy-R*K*.32);ctx.lineTo(cx-R*.09,fy+2);ctx.lineTo(cx+R*.09,fy+2);ctx.closePath();
  ctx.fillStyle=css("--s2");ctx.fill();ctx.lineWidth=lw;ctx.stroke();
}

function animW(dur,done){
  const from=items.map(i=>i.w),t0=performance.now();
  (function st(now){const p=Math.min(1,(now-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    items.forEach((it,i)=>it.w=from[i]+((it.t?0:1)-from[i])*e);draw();
    if(p<1)requestAnimationFrame(st);else done&&done()})(t0);
}
function status(){
  const left=items.filter(i=>!i.t).length;
  $("#status").textContent=!items.length?"Board is empty. Add your first choice below.":left===1?"1 choice left":`${left} choices left`;
  $("#spin").disabled=spinning||!left;
}
function renderList(){
  const ul=$("#list"),lg=$("#legend");ul.innerHTML="";lg.innerHTML="";
  if(!items.length)lg.innerHTML='<li class="empty" style="border:0;padding:0">Each choice you add gets its own colour here.</li>';
  items.forEach((it,i)=>{
    const c=document.createElement("li");if(it.t)c.className="taken";
    c.innerHTML=`<span class="dot" style="background:${it.c}"></span><span class="n"></span>`;c.querySelector(".n").textContent=it.n;lg.appendChild(c);
    const li=document.createElement("li");if(it.t)li.className="taken";
    li.innerHTML=`<button class="dot btn" style="background:${it.t?"var(--blank)":it.c}" aria-label="New colour"></button><span class="n"></span>${it.t?'<span class="tag">PICKED</span>':""}<button class="x" aria-label="Remove">×</button>`;
    li.querySelector(".n").textContent=it.n;
    li.querySelector(".dot").onclick=()=>{if(spinning)return;it.c=randColor();save();refresh()};
    li.querySelector(".x").onclick=()=>{if(spinning)return;items.splice(i,1);save();refresh()};
    ul.appendChild(li);
  });
}
function refresh(){renderList();status();draw()}

function spin(forced,remote){
  if(spinning)return;const open=items.map((it,i)=>it.t?-1:i).filter(i=>i>=0);if(!open.length)return;
  spinning=true;$("#result").hidden=true;status();
  const pick=forced!=null?forced:open[Math.floor(Math.random()*open.length)],[a0,a1]=layout()[pick];
  if(!remote&&ROOM){seenSpin={id:Math.random().toString(36).slice(2,10),pick};
    clearTimeout(pushT);const pk=pack();pk.items[pick].t=true;push(pk)}
  const mid=(a0+a1)/2+(Math.random()-.5)*(a1-a0)*.6;
  let target=Math.PI/2-mid;
  const start=rot,base=start+Math.PI*2*(5+Math.floor(Math.random()*3));
  target+=Math.ceil((base-target)/(Math.PI*2))*Math.PI*2;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,dur=reduce?300:4200,t0=performance.now();
  (function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);rot=start+(target-start)*e;draw();
    if(p<1)return requestAnimationFrame(step);
    rot%=Math.PI*2;
    $("#resName").textContent=items[pick].n;$("#result").hidden=false;
    setTimeout(()=>{items[pick].t=true;renderList();status();
      animW(reduce?1:700,()=>{
        if(items.every(i=>i.t)){$("#status").textContent="Every choice is out. Resetting the board.";
          setTimeout(()=>{items.forEach(i=>i.t=false);spinning=false;if(!remote)save();renderList();status();animW(reduce?1:800)},1400)}
        else{spinning=false;status()}
      });
    },900);
  })(t0);
}
function roomInfo(){
  const el=$("#roomInfo");
  if(!ROOM){el.textContent="Create a share link so friends see this board, with its title and description, and every spin live.";$("#linkBox").hidden=true;$("#invite").hidden=false;return}
  el.textContent=netOk?"Anyone with this link sees the same board and every spin, live.":"Can't reach the server, so changes aren't shared yet. Check the functions folder and the DB binding on Cloudflare.";
  $("#invite").hidden=true;$("#linkBox").hidden=false;$("#linkTxt").value=location.origin+location.pathname+"?board="+ROOM;
}
$("#invite").onclick=async()=>{
  ROOM=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");
  history.replaceState(null,"","?board="+ROOM);roomInfo();await push();startPoll();$("#linkTxt").select();
};
$("#copy").onclick=()=>{const t=$("#linkTxt");const done=()=>{$("#copy").textContent="Copied";setTimeout(()=>$("#copy").textContent="Copy",1500)};
  if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(done,()=>t.select());else t.select()};
$("#title").oninput=e=>{title=e.target.value;document.title=title||"Spin board";save()};
$("#desc").oninput=e=>{desc=e.target.value;save()};
$("#spin").onclick=()=>spin();cv.onclick=()=>spin();
$("#reset").onclick=()=>{if(spinning)return;items.forEach(i=>i.t=false);$("#result").hidden=true;save();renderList();status();animW(600)};
$("#addForm").onsubmit=e=>{e.preventDefault();const v=$("#newName").value.trim();if(!v||items.length>=60)return;items.push({n:v,t:false,w:1,c:randColor()});$("#newName").value="";save();refresh()};
new ResizeObserver(size).observe(cv);
document.fonts?.ready.then(draw);
let polling=false;
function startPoll(){if(polling||!ROOM)return;polling=true;pull();setInterval(pull,2500);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()})}
fillHead();roomInfo();refresh();startPoll();
</script>
</body>
</html>
